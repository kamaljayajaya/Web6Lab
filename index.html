<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pendaftaran Workshop</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>

  <div class="container">
    <h2>Form Pendaftaran Workshop</h2>
    
    <form id="formWorkshop" novalidate>
      <!-- Input Nama & Penghitung Karakter -->
      <div class="form-group">
        <label for="namaWorkshop">Nama Lengkap:</label>
        <input type="text" id="namaWorkshop" name="nama" maxlength="50" placeholder="Masukkan nama lengkap...">
        <small class="info-karakter">Jumlah karakter: <span id="sisaKarakter">0</span>/50</small>
      </div>

      <!-- Input Email -->
      <div class="form-group">
        <label for="emailWorkshop">Email:</label>
        <input type="email" id="emailWorkshop" name="email" placeholder="nama@email.com">
      </div>

      <!-- Pilihan Sesi (Dropdown) -->
      <div class="form-group">
        <label for="pilihanSesi">Pilihan Sesi Workshop:</label>
        <select id="pilihanSesi" name="sesi">
          <option value="">-- Pilih Sesi Workshop --</option>
          <option value="Sesi 1: Dasar-dasar JavaScript & DOM">Sesi 1: Dasar-dasar JavaScript & DOM</option>
          <option value="Sesi 2: Event Handling & Form Validation">Sesi 2: Event Handling & Form Validation</option>
          <option value="Sesi 3: Pengembangan Aplikasi Web Interaktif">Sesi 3: Pengembangan Aplikasi Web Interaktif</option>
        </select>
        <p id="infoSesi" class="info-sesi"></p>
      </div>

      <!-- Tombol Aksi -->
      <div class="button-group">
        <button type="submit" id="btnDaftar">Daftar</button>
        <button type="button" id="btnReset">Reset / Hapus</button>
      </div>
    </form>

    <!-- Area Pesan (Error / Sukses) -->
    <div id="pesanFeedback" aria-live="polite"></div>

    <!-- Ringkasan Input Secara Langsung -->
    <div class="card-ringkasan">
      <h3>Ringkasan Pendaftaran (Live)</h3>
      <p><strong>Nama:</strong> <span id="previewNama">-</span></p>
      <p><strong>Email:</strong> <span id="previewEmail">-</span></p>
      <p><strong>Sesi:</strong> <span id="previewSesi">-</span></p>
    </div>
  </div>

</body>
</html>
